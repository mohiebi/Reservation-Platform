services:
  app:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    build:
      context: .
    command: ["supervisord", "-c", "/etc/supervisord.conf", "-n"]
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/var/www/html

  scheduler:
    build:
      context: .
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/var/www/html

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation_platform
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
